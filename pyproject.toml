[project]
name = "projects-api"
version = "0.1.0"
description = "Projects API: create and manage projects that host agents, MCP servers and web apps. FastAPI on AWS Lambda behind API Gateway, DynamoDB single-table storage."
authors = [{ name = "James Levine", email = "jamesalexanderlevine@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141",
  "mangum>=0.19",
  "boto3>=1.35",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "aws-lambda-powertools[tracer]>=3.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "moto[dynamodb]>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "boto3-stubs[dynamodb]>=1.35",
  "uvicorn>=0.32",
  "openapi-spec-validator>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["projects_api", "projects_provisioner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
packages = ["projects_api", "projects_provisioner"]
mypy_path = "src"
ignore_missing_imports = true
