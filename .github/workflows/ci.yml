name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy
      - name: shellcheck (scripts/*.sh, tests/smoke/smoke.sh)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: style
          ignore_paths: .venv build
      - run: uv run pytest --cov=projects_api --cov-report=term
      - name: Build Lambda package (arm64)
        run: scripts/build_lambda.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: build/lambda.zip
          retention-days: 7

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.3.4"
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate dev
        working-directory: infra/terraform/envs/dev
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate prod
        working-directory: infra/terraform/envs/prod
        run: terraform init -backend=false -input=false && terraform validate

  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
          github_token: ${{ github.token }}
      - name: tflint init (downloads the aws ruleset; retried)
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            if tflint --init --config .tflint.hcl; then ok=1; break; fi
            echo "tflint --init failed (attempt $attempt), retrying"; sleep 10
          done
          test "$ok" = 1
      - name: tflint
        working-directory: infra/terraform
        run: tflint --recursive --config "$(pwd)/.tflint.hcl"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: checkov (pinned; install retried, scan config in .checkov.yaml)
        run: |
          ok=0
          for attempt in 1 2 3; do
            if uvx --python 3.12 --from 'checkov==3.3.19' checkov --version; then ok=1; break; fi
            echo "checkov install failed (attempt $attempt), retrying"; sleep 10
          done
          test "$ok" = 1
          uvx --python 3.12 --from 'checkov==3.3.19' checkov --config-file .checkov.yaml
